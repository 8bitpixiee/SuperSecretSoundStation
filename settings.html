<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Station controls."><title>Control Frequency</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body class="settings-page" data-page="settings">
  <img id="customCursor" class="custom-cursor" src="ugz_cursor.png" alt="" aria-hidden="true">
  <main class="settings-console">
    <p>PRIVATE CONTROL FREQUENCY</p>
    <h1>STATION SETTINGS</h1>
    <section class="settings-module" aria-labelledby="broadcastControlTitle">
      <h2 id="broadcastControlTitle">BROADCAST CONTROL</h2>
      <div id="settingsState" class="settings-state"><span class="settings-light"></span><span id="settingsStateText">CHECKING CONTROL LINK...</span></div>
      <button id="liveToggle" class="settings-toggle" type="button" disabled>GO LIVE</button>
      <small>Changes here update the shared station status for every listener.</small>
    </section>
  </main>
  <button class="route-arrow route-left home-trigger" type="button" aria-label="Return to the beginning">&#10094;</button>
  <button class="route-arrow route-right station-trigger" type="button" aria-label="Open station">&#10095;</button>
  <footer class="portal-footer"><button class="portal-logo station-trigger" type="button" aria-label="Open station"><img src="Hat_tip_logo.png" alt=""></button><div class="credit-stack"><span>Powered By: <strong>PIXIECO&trade;</strong></span><span>ART BY <strong>@wirekittie</strong></span><span class="credit-marks"><img src="pixieco-logo.png" alt="PIXIECO logo"><img src="wirekittie-logo.png" alt="Wire Kittie logo"></span></div><button class="portal-logo portal-logo-mirrored home-trigger" type="button" aria-label="Return home"><img src="Hat_tip_logo.png" alt=""></button></footer>
</body>
</html>
