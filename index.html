<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="What is this?">
  <title>...</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="mystery-page" data-page="landing">
  <img id="customCursor" class="custom-cursor" src="ugz_cursor.png" alt="" aria-hidden="true">

  <main class="mystery-void" aria-label="Unknown destination">
    <button class="route-arrow route-left access-trigger" type="button" data-destination="station" aria-label="Find the station">&#10094;</button>
    <button class="route-arrow route-right access-trigger" type="button" data-destination="vault" aria-label="Find the vault">&#10095;</button>
  </main>

  <footer class="portal-footer" aria-label="Site access and credits">
    <button class="portal-logo access-trigger" type="button" data-destination="station" aria-label="Enter station code">
      <img src="Hat_tip_logo.png" alt="">
    </button>
    <button class="credit-stack access-trigger" type="button" data-destination="settings" aria-label="Enter settings code">
      <span>Powered By: <strong>PIXIECO&trade;</strong></span>
      <span>ART BY <strong>@wirekittie</strong></span>
      <span class="credit-marks"><img src="pixieco-logo.png" alt="PIXIECO logo"><img src="wirekittie-logo.png" alt="Wire Kittie logo"></span>
    </button>
    <button class="portal-logo portal-logo-mirrored access-trigger" type="button" data-destination="vault" aria-label="Enter vault code">
      <img src="Hat_tip_logo.png" alt="">
    </button>
  </footer>

  <dialog id="dpadPanel" class="dpad-panel" aria-labelledby="dpadTitle">
    <form method="dialog" class="dpad-shell">
      <div class="dpad-heading"><h2 id="dpadTitle">WHAT IS THIS?</h2><button class="dpad-close" value="close" aria-label="Close">&times;</button></div>
      <div class="access-timer"><span id="timerText">20.0</span> SECONDS</div>
      <output id="dpadReadout" class="dpad-readout" aria-live="polite">CHOOSE A PATH.</output>
      <div class="dpad-controls" aria-label="Directional code controls">
        <button type="button" class="dpad-key dpad-up" data-direction="UP" aria-label="Up">&#9650;</button>
        <button type="button" class="dpad-key dpad-left" data-direction="LEFT" aria-label="Left">&#9664;</button>
        <span class="dpad-center" aria-hidden="true"></span>
        <button type="button" class="dpad-key dpad-right" data-direction="RIGHT" aria-label="Right">&#9654;</button>
        <button type="button" class="dpad-key dpad-down" data-direction="DOWN" aria-label="Down">&#9660;</button>
      </div>
      <div id="settingsPasscode" class="settings-passcode" hidden>
        <label for="settingsPasscodeInput">SECOND KEY</label>
        <input id="settingsPasscodeInput" type="password" autocomplete="current-password" maxlength="128">
        <button id="settingsSubmit" type="button">VERIFY</button>
      </div>
      <button id="dpadReset" class="dpad-reset" type="button">CLEAR CODE</button>
    </form>
  </dialog>
</body>
</html>
