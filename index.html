<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Super Secret Sound Station — live radio.">
  <title>Super Secret Sound Station</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <img id="customCursor" class="custom-cursor" src="ugz_cursor.png" alt="" aria-hidden="true">

  <main class="station">
    <div class="glow" aria-hidden="true"></div>

    <button id="dpadOpen" class="dpad-logo-button" type="button" aria-label="Open the secret D-pad">
      <img src="Hat_tip_logo.png" alt="Open secret music controls">
      <span>SECRET INPUT</span>
    </button>

    <div class="record-indicator" role="status" aria-label="Live broadcast">
      <span class="record-lamp"></span>
      <span>Broadcasting LIVE, from somewhere...</span>
    </div>

    <button id="gramophoneButton" class="gramophone-hitbox" type="button"
      aria-label="Toggle radio station" aria-pressed="false"></button>

    <div id="gramophoneStage" class="gramophone-stage" aria-hidden="true">
      <img class="gramophone" src="gramophonenobg.gif" alt="" draggable="false">
      <div class="music-notes">
        <img class="music-note note-one" src="musicnot1.png" alt="" draggable="false">
        <img class="music-note note-two" src="musicnot2.png" alt="" draggable="false">
        <img class="music-note note-three" src="musicnot3.png" alt="" draggable="false">
      </div>
    </div>

    <section class="hardware" aria-label="Radio controls">
      <label class="volume-control" for="volume">
        <span>VOLUME</span>
        <span id="volumeKnob" class="volume-knob" aria-hidden="true"><i></i></span>
        <input id="volume" type="range" min="0" max="100" value="75" aria-label="Volume">
      </label>
    </section>

    <span id="playerStatus" class="status" role="status" aria-live="polite">READY</span>
    <footer class="site-credit" aria-label="Site credits">
      <img class="credit-logo pixieco-logo" src="pixieco-logo.png" alt="PIXIECO logo">
      <span>Powered By: <strong>PIXIECO&trade;</strong></span>
      <span class="art-credit">ART BY <strong>@wirekittie</strong></span>
      <img class="credit-logo wirekittie-logo" src="wirekittie-logo.png" alt="Wire Kittie logo">
    </footer>
    <audio id="radioPlayer" preload="none" src="https://s12.myradiostream.com:19856/listen.mp3"></audio>
  </main>

  <dialog id="dpadPanel" class="dpad-panel" aria-labelledby="dpadTitle">
    <form method="dialog" class="dpad-shell">
      <div class="dpad-heading">
        <h2 id="dpadTitle">SECRET FREQUENCY</h2>
        <button class="dpad-close" value="close" aria-label="Close secret D-pad">&times;</button>
      </div>
      <output id="dpadReadout" class="dpad-readout" aria-live="polite">_ _ _ _ _ _ _ _</output>
      <div class="dpad-controls" aria-label="Directional code controls">
        <button type="button" class="dpad-key dpad-up" data-direction="UP" aria-label="Up">&#9650;</button>
        <button type="button" class="dpad-key dpad-left" data-direction="LEFT" aria-label="Left">&#9664;</button>
        <span class="dpad-center" aria-hidden="true"></span>
        <button type="button" class="dpad-key dpad-right" data-direction="RIGHT" aria-label="Right">&#9654;</button>
        <button type="button" class="dpad-key dpad-down" data-direction="DOWN" aria-label="Down">&#9660;</button>
      </div>
      <button id="dpadReset" class="dpad-reset" type="button">CLEAR CODE</button>
    </form>
  </dialog>
</body>
</html>
