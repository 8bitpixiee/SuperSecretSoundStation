<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Super Secret Sound Station — live radio.">
  <title>Super Secret Sound Station</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="station">
    <div class="glow" aria-hidden="true"></div>

    <button id="playerButton" class="player" type="button"
      aria-label="Play radio station" aria-pressed="false">
      <img class="gramophone" src="assets/gramophone.gif" alt="" draggable="false">
      <span id="playerLabel" class="player-label">PLAY</span>
    </button>

    <section class="console" aria-label="Radio controls">
      <label class="volume-control" for="volume">
        <span>VOLUME</span>
        <input id="volume" type="range" min="0" max="100" value="75">
        <span id="volumeKnob" class="volume-knob" aria-hidden="true"><i></i></span>
      </label>
      <span id="playerStatus" class="status" role="status" aria-live="polite">READY</span>
    </section>

    <audio id="radioPlayer" preload="none"
      src="https://s12.myradiostream.com:19856/listen.mp3"></audio>
  </main>
</body>
</html>
